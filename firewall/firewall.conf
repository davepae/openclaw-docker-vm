# Phase 1 network values for the OpenClaw VM.
# Installed to /etc/openclaw/firewall.conf by firewall/install.sh.

# Gateway network: fixed subnet and a fixed bridge name, so rules can match it.
OC_GW_NETWORK="oc-gw"
OC_GW_SUBNET="172.30.10.0/24"
OC_GW_BRIDGE="br-oc-gw"

# LAN DNS (pfSense Unbound). Docker's embedded resolver forwards here.
DNS_IP="172.16.1.2"

# The only TCP destinations the gateway container may open, as ip:port.
#   172.16.1.67:8080   Strata on llm.paelab.com
#   172.16.3.100:8080  SearXNG on intelnuc6
#   172.16.3.100:3002  Firecrawl on intelnuc6
ALLOW_TCP="172.16.1.67:8080 172.16.3.100:8080 172.16.3.100:3002"
